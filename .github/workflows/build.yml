name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional app version name (for example 1.6)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch sherpa-onnx native libs
        run: bash scripts/fetch-sherpa.sh
      - name: Version
        id: ver
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; elif [[ -n "$VERSION_NAME" ]]; then V="$VERSION_NAME"; else V="0.0.${GITHUB_RUN_NUMBER}-dev"; fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
      - run: gradle assembleDebug --no-daemon -Pvn=${{ steps.ver.outputs.name }} -Pvc=${{ github.run_number }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk weime-${{ steps.ver.outputs.name }}.apk
      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=weime-${{ steps.ver.outputs.name }}.apk
          ls -l "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign OK"
          "$BT/aapt2" dump badging "$APK" | head -8
      - uses: actions/upload-artifact@v4
        with:
          name: weime-apk
          path: weime-${{ steps.ver.outputs.name }}.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: weime-${{ steps.ver.outputs.name }}.apk
