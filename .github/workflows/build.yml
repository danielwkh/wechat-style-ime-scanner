name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional app version name (for example 1.6)'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Fetch sherpa-onnx native libs
        run: bash scripts/fetch-sherpa.sh
      - name: Fetch Cangjie/Quick data
        run: bash scripts/fetch-ime-data.sh
      - name: Version
        id: ver
        env:
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$V"
            VC=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          elif [[ -n "$VERSION_NAME" ]]; then
            V="$VERSION_NAME"
            VC="$GITHUB_RUN_NUMBER"
          else
            V="0.0.${GITHUB_RUN_NUMBER}-dev"
            VC="$GITHUB_RUN_NUMBER"
          fi
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$VC" >> "$GITHUB_OUTPUT"
      - run: gradle assembleDebug --no-daemon -Pvn=${{ steps.ver.outputs.name }} -Pvc=${{ steps.ver.outputs.code }}
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk weime-${{ steps.ver.outputs.name }}.apk
      - name: Verify APK
        run: |
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          APK=weime-${{ steps.ver.outputs.name }}.apk
          ls -l "$APK"
          unzip -tq "$APK"
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          "$BT/zipalign" -c 4 "$APK" && echo "zipalign OK"
          "$BT/aapt2" dump badging "$APK" | head -8
      - name: Verify related-word assets
        run: |
          APK=weime-${{ steps.ver.outputs.name }}.apk
          # 關聯詞表若沒打包，功能會靜默退回 37 個手寫詞，所以這裡直接擋下來
          unzip -l "$APK" | grep -E "assets/related\.tsv" || {
            echo "ERROR: assets/related.tsv missing from APK"; exit 1; }
          N=$(unzip -p "$APK" assets/related.tsv | wc -l)
          echo "related.tsv anchors: $N"
          test "$N" -gt 1000 || { echo "ERROR: related.tsv too small ($N anchors)"; exit 1; }
          unzip -l "$APK" | grep -E "assets/(cangjie5\.base\.dict\.yaml|freq\.tsv|stroke\.tsv)"
      - uses: actions/upload-artifact@v4
        with:
          name: weime-apk
          path: weime-${{ steps.ver.outputs.name }}.apk
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: weime-${{ steps.ver.outputs.name }}.apk
